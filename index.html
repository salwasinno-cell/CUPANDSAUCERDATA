<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Master Product Data Entry</title>
<style>
  :root{
    --charcoal:#1B1C1F;
    --charcoal-2:#25262A;
    --ivory:#FAF9F5;
    --ivory-2:#F2F0E8;
    --ink:#1B1C1F;
    --ink-soft:#787A70;
    --hairline:#E4E1D6;
    --hairline-strong:#CFCBB9;
    --brass:#C7A764;
    --brass-light:#F5ECD8;
    --brass-dim:#B08F52;
    --white:#FFFFFF;
    --danger:#A64B42;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--ivory);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- Top bar ---------- */
  .topbar{
    background:var(--charcoal);
    color:var(--white);
    padding:22px 32px 20px;
    border-bottom:1px solid #000;
  }
  .topbar-inner{
    max-width:1500px;
    margin:0 auto;
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    flex-wrap:wrap;
    gap:16px;
  }
  .title-block h1{
    font-family: ui-serif, "Iowan Old Style", Georgia, serif;
    font-weight:500;
    font-size:22px;
    letter-spacing:0.2px;
    margin:0 0 6px;
    color:var(--white);
  }
  .brandmark{
    font-family: ui-serif, "Iowan Old Style", Georgia, serif;
    font-size:19px;
    font-weight:500;
    color:var(--white);
    letter-spacing:0.3px;
    margin-bottom:12px;
  }
  .brandmark .amp{
    font-style:italic;
    color:var(--brass);
    font-weight:500;
    margin:0 2px;
  }
  .eyebrow{
    font-size:10.5px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--brass-dim);
    font-weight:600;
    margin:0 0 8px;
  }
  .meta-line{
    font-size:12px;
    color:#A7A9A2;
  }
  .meta-line strong{color:var(--brass-light);font-weight:600;}

  /* ---------- Toolbar ---------- */
  .toolbar{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
  }
  button{
    font-family:inherit;
    font-size:12.5px;
    font-weight:500;
    padding:9px 16px;
    border-radius:2px;
    cursor:pointer;
    border:1px solid transparent;
    transition:background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
  }
  .btn-ghost{
    background:transparent;
    border:1px solid #45464B;
    color:#D8D9D4;
  }
  .btn-ghost:hover{border-color:var(--brass-dim);color:var(--brass-light);}
  .btn-brass{
    background:var(--brass);
    color:#1B1C1F;
    border:1px solid var(--brass);
  }
  .btn-brass:hover{background:#BE9744;}
  .btn-danger-ghost{
    background:transparent;
    border:1px solid #45464B;
    color:#C98E86;
  }
  .btn-danger-ghost:hover{border-color:var(--danger);color:#E4A79E;}

  /* ---------- Stats strip ---------- */
  .stats{
    max-width:1500px;
    margin:0 auto;
    padding:14px 32px;
    display:flex;
    gap:36px;
    flex-wrap:wrap;
  }
  .stat{display:flex;flex-direction:column;gap:2px;}
  .stat .num{font-size:19px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;}
  .stat .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:1px;color:var(--ink-soft);}

  /* ---------- Sheet container ---------- */
  .sheet-wrap{
    max-width:1500px;
    margin:0 auto 60px;
    padding:0 32px;
  }
  .sheet-card{
    background:var(--white);
    border:1px solid var(--hairline-strong);
    box-shadow:0 1px 2px rgba(27,28,31,0.04), 0 12px 28px rgba(27,28,31,0.06);
    overflow:hidden;
  }
  .table-scroll{
    overflow-x:auto;
    max-height:72vh;
    overflow-y:auto;
  }
  table{border-collapse:separate;border-spacing:0;min-width:100%;}

  thead th{
    position:sticky;
    font-weight:600;
    padding:0;
    white-space:nowrap;
    text-align:left;
    z-index:3;
  }
  thead tr.group th{
    top:0;
    background:var(--charcoal-2);
    color:var(--brass-light);
    font-size:10px;
    letter-spacing:1.1px;
    text-transform:uppercase;
    padding:9px 14px;
    border-right:1px solid #35363B;
    border-bottom:1px solid #000;
  }
  thead tr.group th.rowno-head{
    background:var(--charcoal);
    left:0;
    z-index:5;
  }
  thead tr.field th{
    top:35px;
    background:var(--ivory-2);
    color:var(--ink);
    font-size:11.5px;
    padding:10px 14px;
    border-right:1px solid var(--hairline);
    border-bottom:1px solid var(--hairline-strong);
  }
  thead tr.field th.rowno-head{
    left:0;
    z-index:4;
    background:var(--ivory-2);
    border-right:1px solid var(--hairline-strong);
  }

  tbody td{
    border-right:1px solid var(--hairline);
    border-bottom:1px solid var(--hairline);
    padding:0;
    background:var(--white);
  }
  tbody tr:nth-child(even) td{background:#FCFBF8;}
  tbody tr:hover td{background:var(--brass-light) !important;opacity:1;}
  tbody tr:hover td input.cell{background:transparent;}

  .rowno{
    position:sticky;
    left:0;
    z-index:2;
    text-align:center;
    font-size:11.5px;
    color:var(--ink-soft);
    background:var(--ivory-2) !important;
    padding:9px 6px;
    border-right:1px solid var(--hairline-strong);
    font-variant-numeric:tabular-nums;
    min-width:52px;
  }
  .rowno .del{
    border:none;background:transparent;color:var(--danger);
    font-size:13px;cursor:pointer;padding:2px 4px;
    opacity:0.55;
  }
  .rowno:hover .del{opacity:1;}

  input.cell{
    width:100%;
    min-width:130px;
    border:none;
    border-left:2px solid transparent;
    background:transparent;
    font-family:inherit;
    font-size:12.8px;
    color:var(--ink);
    padding:9px 14px;
    outline:none;
  }
  input.cell::placeholder{color:#C6C4B8;}
  input.cell:focus{
    border-left:2px solid var(--brass);
    background:var(--brass-light) !important;
  }

  footer.note{
    max-width:1500px;
    margin:0 auto 40px;
    padding:0 32px;
    font-size:12px;
    color:var(--ink-soft);
    display:flex;
    align-items:center;
    gap:8px;
  }
  footer.note .dot{width:5px;height:5px;border-radius:50%;background:var(--brass);display:inline-block;}

  ::-webkit-scrollbar{height:11px;width:11px;}
  ::-webkit-scrollbar-track{background:var(--ivory-2);}
  ::-webkit-scrollbar-thumb{background:var(--hairline-strong);border-radius:6px;border:2px solid var(--ivory-2);}
  ::-webkit-scrollbar-thumb:hover{background:var(--brass-dim);}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <div class="title-block">
      <div class="brandmark">Cup <span class="amp">&amp;</span> Saucer</div>
      <div class="eyebrow">Product Catalog · Data Entry</div>
      <h1>Master Product Data Entry</h1>
      <div class="meta-line">Approved field set · <strong>7 sections</strong> · <strong id="fieldCountTop">–</strong> fields per product</div>
    </div>
    <div class="toolbar">
      <button class="btn-brass" onclick="addRow()">+ Add Product</button>
      <button class="btn-ghost" onclick="addRows(10)">+ Add 10 Rows</button>
      <button class="btn-ghost" onclick="copyAsCSV()">Copy as CSV</button>
      <button class="btn-ghost" onclick="copyAsJSON()">Copy as JSON</button>
      <button class="btn-danger-ghost" onclick="clearAll()">Clear Sheet</button>
    </div>
  </div>
</div>

<div class="stats">
  <div class="stat"><div class="num" id="statRows">0</div><div class="lbl">Products</div></div>
  <div class="stat"><div class="num" id="statFields">0</div><div class="lbl">Fields Tracked</div></div>
  <div class="stat"><div class="num" id="statSections">7</div><div class="lbl">Sections</div></div>
  <div class="stat"><div class="num" id="statFilled">0%</div><div class="lbl">Cells Filled</div></div>
</div>

<div class="sheet-wrap">
  <div class="sheet-card">
    <div class="table-scroll">
      <table>
        <thead id="thead"></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>
</div>

<footer class="note"><span class="dot"></span>Click any cell to edit. Add rows as you build the catalog, then export the full sheet as CSV or JSON.</footer>

<script>
// ================= SUPABASE SETUP =================
// Paste your project URL and browser-safe Publishable/Anon key below.
// NEVER put a service_role or secret key in this file.
const SUPABASE_URL = 'https://thcoiqgxcqbdlnpjnyyr.supabase.co/rest/v1/';
const SUPABASE_ANON_KEY = 'sb_publishable_n46yu9uesrOYP66NxQWVXA_cqvlGfXJ';

const schema = [
  { section: "Identification", fields: ["Product Image 1","Product Name EN","Product Name AR","SKU","Barcode / EAN / UPC","Brand"] },
  { section: "Classification", fields: ["Main Category","Subcategory"] },
  { section: "Product Details", fields: ["Description EN","Description AR","Color","Material","Pieces Number","Suitable For / Persons","Included Pieces","Care Instructions"] },
  { section: "Dimensions", fields: ["Width","Length","Height","Depth","Diameter","Capacity"] },
  { section: "Pricing", fields: ["Regular Price"] },
  { section: "Inventory", fields: ["Stock Quantity"] },
  { section: "Delivery Data", fields: ["Package Weight","Package Length","Package Width","Package Height","Fragile"] },
];
const flatFields = schema.flatMap(g => g.fields.map(f => ({section:g.section, field:f})));
document.getElementById('fieldCountTop').textContent = flatFields.length;
document.getElementById('statFields').textContent = flatFields.length;

let rows = []; // [{id, values:Array}]
let db = null;
let saveTimers = new Map();
let isConnected = false;

function valuesToObject(values){
  const obj={}; flatFields.forEach((f,i)=>obj[f.field]=values[i]||""); return obj;
}
function objectToValues(obj){ return flatFields.map(f => obj?.[f.field] ?? ""); }
function status(text, ok=false){
  let el=document.getElementById('dbStatus');
  if(!el){ el=document.createElement('span'); el.id='dbStatus'; el.style.marginLeft='10px'; el.style.fontSize='12px'; document.querySelector('.meta-line').appendChild(el); }
  el.textContent=' · '+text; el.style.color=ok?'#C7A764':'#C98E86';
}

function buildHead(){
  const thead=document.getElementById('thead'); thead.innerHTML='';
  const groupRow=document.createElement('tr'); groupRow.className='group'; groupRow.innerHTML=`<th class="rowno-head">#</th>`;
  schema.forEach(g=>{ const th=document.createElement('th'); th.colSpan=g.fields.length; th.textContent=g.section; groupRow.appendChild(th); });
  const fieldRow=document.createElement('tr'); fieldRow.className='field'; fieldRow.innerHTML=`<th class="rowno-head"></th>`;
  flatFields.forEach(f=>{ const th=document.createElement('th'); th.textContent=f.field; fieldRow.appendChild(th); });
  thead.append(groupRow,fieldRow);
}
buildHead();

async function initSupabase(){
  if(SUPABASE_URL.startsWith('PASTE_') || SUPABASE_ANON_KEY.startsWith('PASTE_')){
    status('Supabase credentials required'); renderBody(); return;
  }
  try{
    db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    status('Connecting…');
    const {data,error}=await db.from('products').select('id,values').order('id',{ascending:true});
    if(error) throw error;
    rows=(data||[]).map(r=>({id:r.id,values:objectToValues(r.values)}));
    isConnected=true; status('Saved to cloud ✓',true); renderBody();
  }catch(e){ console.error(e); status('Database error: '+(e.message||e)); renderBody(); }
}

async function addRow(){
  const values=new Array(flatFields.length).fill('');
  if(!db){ rows.push({id:null,values}); renderBody(); return; }
  const {data,error}=await db.from('products').insert({values:valuesToObject(values)}).select('id,values').single();
  if(error){ alert('Could not add product: '+error.message); return; }
  rows.push({id:data.id,values:objectToValues(data.values)}); renderBody();
}
async function addRows(n){ for(let i=0;i<n;i++) await addRow(); }
async function deleteRow(idx){
  const row=rows[idx];
  if(row?.id && db){ const {error}=await db.from('products').delete().eq('id',row.id); if(error){alert('Could not delete: '+error.message);return;} }
  rows.splice(idx,1); renderBody();
}
async function clearAll(){
  if(rows.length && !confirm('Clear the entire sheet? This deletes all products from the shared database.')) return;
  if(db && rows.length){
    const ids=rows.map(r=>r.id).filter(Boolean);
    if(ids.length){ const {error}=await db.from('products').delete().in('id',ids); if(error){alert('Could not clear: '+error.message);return;} }
  }
  rows=[]; renderBody();
}
function queueSave(rowIndex){
  const row=rows[rowIndex]; if(!row?.id || !db) return;
  clearTimeout(saveTimers.get(row.id)); status('Saving…');
  saveTimers.set(row.id,setTimeout(async()=>{
    const {error}=await db.from('products').update({values:valuesToObject(row.values),updated_at:new Date().toISOString()}).eq('id',row.id);
    if(error){ console.error(error); status('Save failed: '+error.message); }
    else status('Saved to cloud ✓',true);
  },450));
}
function renderBody(){
  const tbody=document.getElementById('tbody'); tbody.innerHTML='';
  rows.forEach((row,rIdx)=>{
    const tr=document.createElement('tr');
    const rowNoTd=document.createElement('td'); rowNoTd.className='rowno'; rowNoTd.innerHTML=`${rIdx+1} <button class="del" title="Delete row" onclick="deleteRow(${rIdx})">✕</button>`; tr.appendChild(rowNoTd);
    flatFields.forEach((f,cIdx)=>{
      const td=document.createElement('td'), input=document.createElement('input');
      input.className='cell'; input.type='text'; input.placeholder=f.field; input.value=row.values[cIdx]||'';
      input.addEventListener('input',e=>{ row.values[cIdx]=e.target.value; updateStats(); queueSave(rIdx); });
      td.appendChild(input); tr.appendChild(td);
    }); tbody.appendChild(tr);
  }); updateStats();
}
function updateStats(){
  document.getElementById('statRows').textContent=rows.length;
  const total=rows.length*flatFields.length;
  const filled=rows.reduce((acc,row)=>acc+row.values.filter(v=>v&&String(v).trim()!=='').length,0);
  document.getElementById('statFilled').textContent=total?Math.round((filled/total)*100)+'%':'0%';
}
function copyAsCSV(){
  const header=flatFields.map(f=>f.field), csvRows=[header,...rows.map(r=>r.values)];
  const csv=csvRows.map(r=>r.map(c=>`"${(c||'').toString().replace(/"/g,'""')}"`).join(',')).join('\n');
  navigator.clipboard.writeText(csv).then(()=>flash(event.target,'Copied ✓'));
}
function copyAsJSON(){
  const out=rows.map(row=>valuesToObject(row.values));
  navigator.clipboard.writeText(JSON.stringify(out,null,2)).then(()=>flash(event.target,'Copied ✓'));
}
function flash(btn,msg){ const old=btn.textContent; btn.textContent=msg; setTimeout(()=>btn.textContent=old,1200); }

initSupabase();
</script>
</body>
</html>
